# Centinela de precios — edita SOLO este fichero para elegir qué vigilas.
#
# Las claves de API nunca se escriben aquí: se referencian por el nombre de la
# variable de entorno (ver README y GitHub Secrets).
version: 1

defaults:
  currency: usd
  cooldown_minutes: 180 # silencio mínimo entre mensajes del MISMO activo
  hysteresis_pct: 0.25 # banda muerta al volver al rango: evita rebotes en el umbral
  notify_on_return: true # avisar también al volver dentro del rango
  renotify_while_outside: false
  max_staleness_minutes: 240 # un precio más viejo que esto se trata como fallo
  first_run_policy: summary # none | summary | full

providers:
  coingecko:
    api_key_env: COINGECKO_DEMO_KEY # opcional: sin ella funciona en modo keyless
  twelvedata:
    api_key_env: TWELVEDATA_API_KEY
    batch_size: 8
  stooq: {} # sin clave

notifier:
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
    parse_mode: HTML

assets:
  - id: xrp
    label: XRP
    provider: coingecko
    symbol: ripple
    currency: usd
    lower: 1.19
    upper: 1.41
  - id: btc
    label: Bitcoin
    provider: coingecko
    symbol: bitcoin
    currency: usd
    lower: null
    upper: 77000
    fallback:
      provider: stooq
      symbol: btcusd
  - id: doge
    label: Dogecoin
    provider: coingecko
    symbol: dogecoin
    currency: usd
    lower: null
    upper: "0.090"
  - id: marscoin
    label: MARSCOIN
    provider: coingecko
    symbol: MARSCOIN
    currency: usd
    lower: 0.072
    upper: 0.075
  - id: ai
    label: AI
    provider: coingecko
    symbol: AI
    currency: usd
    lower: null
    upper: 0.00015
  - id: mcat
    label: Marscat Token
    provider: coingecko
    symbol: marscat-token
    currency: usd
    lower: 0.2
    upper: 1.96
  - id: ai2
    label: Artificial Inu
    provider: coingecko
    symbol: artificial-inu-3
    currency: usd
    lower: 0.23
    upper: 0.413
