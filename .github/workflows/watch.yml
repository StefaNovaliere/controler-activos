name: centinela

on:
  schedule:
    # Cada 10 min, desplazado de los múltiplos exactos: GitHub encola los crons
    # y los retrasa bajo carga, y las horas en punto y las medias son los
    # momentos de más congestión de la plataforma.
    #
    # POR QUÉ 10 Y NO 5, que es el mínimo que admite GitHub. El límite ya no es
    # Vercel —los commits de estado dejaron de disparar deploys— ni los minutos
    # de Actions, que en repositorio público no se facturan. Es CoinGecko:
    #
    #   cada 10 min → 144 consultas/día → ~4.300/mes
    #   cada  5 min → 288 consultas/día → ~8.600/mes
    #
    # La Demo key gratuita son 10.000 al mes. A 5 minutos se gasta el 86 % solo
    # con el cron, sin dejar margen para las consultas del panel (análisis,
    # búsquedas, revisión de tokens), que salen de la misma cuota. A 10 minutos
    # queda holgado. Y sin clave el límite es por IP y compartido con todos los
    # runners de GitHub: impredecible, no generoso.
    #
    # Por debajo de 5 minutos esta arquitectura no da más: cada ejecución levanta
    # un runner, instala dependencias y tarda ~20 s. Para ir más rápido haría
    # falta un proceso que no se apague entre consultas, que es otro programa.
    #
    # Si vuelves a vigilar acciones con Twelve Data, ojo: sus 800 créditos
    # diarios gratuitos dan para ~5 símbolos a esta frecuencia.
    #
    # Durante un plan de trading (config/plan.yml) esto cambia: cada ejecución
    # es un turno de ~5 h 30 min que consulta cada 2 minutos y pide su propio
    # relevo. Ver scripts/turno.sh.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Solo enviar un mensaje de prueba a Telegram y salir"
        type: boolean
        default: false
      dry_run:
        description: "No enviar a Telegram ni persistir el estado"
        type: boolean
        default: false
      force_notify:
        description: "Ignorar el cooldown en esta ejecución"
        type: boolean
        default: false

permissions:
  contents: write        # commitear state/ e history/
  actions: write         # el relevo: lanzar el turno siguiente durante el plan

concurrency:
  # Las pruebas en seco no persisten nada, así que no hace falta que esperen
  # detrás de un turno de cinco horas.
  group: ${{ inputs.dry_run == true && 'centinela-prueba' || 'centinela' }}
  # Cancelar una ejecución a media escritura es la vía más fácil de corromper el
  # estado. Además, serializar elimina las carreras entre dos crons solapados.
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # Durante el plan, un turno dura ~5 h 30 min (scripts/turno.sh). GitHub
    # corta a las 6 h; el resto del tiempo es una pasada de segundos.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        run: pip install --quiet -e .

      # Separa los dos fallos posibles: si este mensaje llega, las credenciales de
      # Telegram son correctas y cualquier silencio posterior es de los precios o
      # de los umbrales, no del bot.
      - name: Mensaje de prueba
        if: inputs.test_message == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m vigilante test-telegram

      # Ver scripts/turno.sh: una pasada, o un bucle cada 2 min durante el
      # plan de config/plan.yml. Persiste el estado y el historial él mismo.
      - name: Vigilar precios
        id: vigilar
        if: inputs.test_message != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          # Para el enlace «Anotar qué hacés» de cada aviso. Vacía = sin enlace.
          PANEL_URL: ${{ vars.PANEL_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: scripts/turno.sh

      # El relevo. El cron de GitHub se dispara cada ~4 h en la práctica, y un
      # turno dura 5 h 30 min: casi siempre habrá uno en cola, pero no siempre
      # (se midieron huecos de 7 h). Así que el turno pide el siguiente antes de
      # terminar. Queda en cola por `concurrency` y arranca en cuanto este
      # acaba. Fuera de la ventana del plan no se pide nada.
      #
      # `workflow_dispatch` es la excepción documentada: un evento lanzado con
      # GITHUB_TOKEN no dispara workflows, salvo este y `repository_dispatch`.
      - name: Relevo
        if: always() && inputs.dry_run != true && inputs.test_message != true && steps.vigilar.outputs.duracion != '' && steps.vigilar.outputs.duracion != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref "$GITHUB_REF_NAME"
