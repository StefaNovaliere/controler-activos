name: centinela

on:
  schedule:
    # Cada 10 min, desplazado de los múltiplos exactos: GitHub encola los crons
    # y los retrasa bajo carga, y las horas en punto y las medias son los
    # momentos de más congestión de la plataforma.
    #
    # POR QUÉ 10 Y NO 5, que es el mínimo que admite GitHub. El límite ya no es
    # Vercel —los commits de estado dejaron de disparar deploys— ni los minutos
    # de Actions, que en repositorio público no se facturan. Es CoinGecko:
    #
    #   cada 10 min → 144 consultas/día → ~4.300/mes
    #   cada  5 min → 288 consultas/día → ~8.600/mes
    #
    # La Demo key gratuita son 10.000 al mes. A 5 minutos se gasta el 86 % solo
    # con el cron, sin dejar margen para las consultas del panel (análisis,
    # búsquedas, revisión de tokens), que salen de la misma cuota. A 10 minutos
    # queda holgado. Y sin clave el límite es por IP y compartido con todos los
    # runners de GitHub: impredecible, no generoso.
    #
    # Por debajo de 5 minutos esta arquitectura no da más: cada ejecución levanta
    # un runner, instala dependencias y tarda ~20 s. Para ir más rápido haría
    # falta un proceso que no se apague entre consultas, que es otro programa.
    #
    # Si vuelves a vigilar acciones con Twelve Data, ojo: sus 800 créditos
    # diarios gratuitos dan para ~5 símbolos a esta frecuencia.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Solo enviar un mensaje de prueba a Telegram y salir"
        type: boolean
        default: false
      dry_run:
        description: "No enviar a Telegram ni persistir el estado"
        type: boolean
        default: false
      force_notify:
        description: "Ignorar el cooldown en esta ejecución"
        type: boolean
        default: false

permissions:
  contents: write        # necesario ÚNICAMENTE para commitear state/state.json

concurrency:
  group: centinela
  # Cancelar una ejecución a media escritura es la vía más fácil de corromper el
  # estado. Además, serializar elimina las carreras entre dos crons solapados.
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        run: pip install --quiet -e .

      # Separa los dos fallos posibles: si este mensaje llega, las credenciales de
      # Telegram son correctas y cualquier silencio posterior es de los precios o
      # de los umbrales, no del bot.
      - name: Mensaje de prueba
        if: inputs.test_message == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m vigilante test-telegram

      - name: Vigilar precios
        if: inputs.test_message != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${FORCE_NOTIFY:-false}" = "true" ]; then ARGS+=(--force-notify); fi
          python -m vigilante run \
            --config config/assets.yml \
            --state state/state.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${ARGS[@]}"

      # `always()`: si el envío falla a mitad, lo ya procesado se guarda igual.
      - name: Persistir el estado y el historial
        if: always() && inputs.dry_run != true && inputs.test_message != true
        run: |
          set -euo pipefail
          if [ ! -f state/state.json ]; then
            echo "No hay estado que guardar."
            exit 0
          fi

          git config user.name  "centinela-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `git add` antes de comparar: en la primera ejecución los ficheros aún
          # no están versionados, y `git diff` a secas ignora lo que no rastrea.
          git add state/state.json history/
          if git diff --cached --quiet -- state/state.json history/; then
            echo "Sin cambios: no se commitea."
            exit 0
          fi

          git commit -m "chore(state): $(date -u +%FT%TZ) [skip ci]"

          # Un push con GITHUB_TOKEN no dispara workflows, así que no hay bucle.
          # El reintento cubre que alguien haya empujado a la rama mientras tanto.
          for intento in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "::error::No se pudo persistir el estado tras 3 intentos"
          exit 1
