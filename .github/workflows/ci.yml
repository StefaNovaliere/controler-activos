name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --quiet -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: La configuración de ejemplo sigue siendo válida
        run: python -m vigilante check --config config/assets.yml

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Tipos
        run: npm run typecheck
        working-directory: web
      # El corpus de schema/cases.json corre aquí Y en pytest. Si los dos lados
      # dejan de dar el mismo veredicto, la validación del formulario y la del bot
      # han divergido, y salta uno de los dos.
      - name: Tests
        run: npm test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
