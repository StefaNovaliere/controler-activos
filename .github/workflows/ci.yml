name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --quiet -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: La configuración de ejemplo sigue siendo válida
        run: python -m vigilante check --config config/assets.yml
