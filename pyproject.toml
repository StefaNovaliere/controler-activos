[project]
name = "vigilante"
version = "0.1.0"
description = "Vigilante de precios con alertas por Telegram al cruzar umbrales"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
vigilante = "vigilante.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
